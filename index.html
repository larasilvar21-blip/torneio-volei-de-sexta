<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2º Torneio Vôlei de Sexta</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#031333;color:#fff;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;position:relative;background:#061737;min-height:100vh}
.page{display:none;position:relative;line-height:0;min-height:100dvh}.page.active{display:block}
.poster{display:block;width:100%;height:auto;min-height:100dvh;object-fit:fill}
.hit{position:absolute;display:block;border:0;background:transparent;cursor:pointer;padding:0;z-index:2}
.enter-btn{display:flex;align-items:center;justify-content:center;gap:14px;background:#ffcb05;color:#071638;border-radius:999px;font-size:clamp(16px,4.5vw,28px);font-weight:900;line-height:1.1;box-shadow:0 8px 22px #0007;letter-spacing:.02em}.enter-btn:hover{background:#ffe04b}.hit:focus-visible{outline:3px solid #ffcc00;outline-offset:-3px;border-radius:10px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}.dialog{width:min(100%,620px);max-height:90vh;overflow:auto;background:#fff;color:#081b43;border-radius:20px;padding:22px;box-shadow:0 16px 50px #0006;line-height:1.5}
.dialog h2{margin:0 42px 12px 0}.dialog h3{margin:16px 0 6px}.dialog ul{padding-left:22px}
.close{float:right;border:0;background:#ffca00;color:#081b43;border-radius:50%;width:38px;height:38px;font-size:25px;cursor:pointer}
.award-menu{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.award-menu span{display:block;width:32px;height:5px;border-radius:5px;background:#061737;box-shadow:0 1px 1px #fff8}@media(max-width:390px){.award-menu span{width:27px;height:4px;gap:4px}}.notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#081b43;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:30;white-space:nowrap}


/* Contador independente, sobreposto à parte inferior da arte original do menu */
.countdown{position:absolute;left:18%;right:18%;top:77%;z-index:3;text-align:center;line-height:1.15;pointer-events:none}
.countdown-title{color:#ffce17;font-size:clamp(10px,2.5vw,16px);font-weight:900;letter-spacing:.035em;margin-bottom:9px;text-shadow:0 2px 5px #00152d}
.countdown-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.4vw,10px)}
.countdown-unit{border:1.5px solid #ffce17;border-radius:10px;background:#061735f2;color:#ffce17;font-size:clamp(18px,4.5vw,30px);font-weight:900;font-variant-numeric:tabular-nums;padding:8px 2px 7px;box-shadow:0 4px 12px #0006}
.countdown-unit small{display:block;color:#fff;font-size:clamp(7px,1.5vw,10px);font-weight:800;letter-spacing:0;margin-top:4px}
.countdown-finished{grid-column:1/-1;background:#061735ee;color:#ffce17;border:1px solid #ffce17;border-radius:10px;padding:12px;font-weight:900;font-size:clamp(12px,3vw,18px)}
</style></head><body>
<main>
<section class="page active" id="inicio"><img class="poster" src="imagens/inicio.png" alt="Abertura do 2º Torneio Vôlei de Sexta"><button class="hit" style="left:18%;top:82%;width:64%;height:8%" aria-label="Entrar no evento" onclick="go('menu')"></button></section>
<section class="page" id="menu"><img class="poster" src="imagens/menu.png" alt="Menu do torneio">
<button class="hit" style="left:4%;top:33.8%;width:45%;height:11%" aria-label="Informações gerais" onclick="go('informacoes')"></button>
<button class="hit" style="left:51%;top:33.8%;width:45%;height:11%" aria-label="Investimento e inscrições" onclick="go('inscricoes')"></button>
<button class="hit" style="left:4%;top:45.4%;width:45%;height:11%" aria-label="Regulamento" onclick="go('regulamento')"></button>
<button class="hit" style="left:51%;top:45.4%;width:45%;height:11%" aria-label="Times e chaveamento" onclick="modal('breve')"></button>
<button class="hit" style="left:4%;top:57%;width:45%;height:11%" aria-label="Premiações" onclick="go('premiacoes')"></button>
<button class="hit" style="left:51%;top:57%;width:45%;height:11%" aria-label="Fotografia oficial" onclick="go('fotografia')"></button>
<div class="countdown" role="timer" aria-label="Contagem regressiva para o torneio"><div class="countdown-title">CONTAGEM REGRESSIVA</div><div class="countdown-grid" id="countdown-values"><div class="countdown-unit">--<small>DIAS</small></div><div class="countdown-unit">--<small>HORAS</small></div><div class="countdown-unit">--<small>MINUTOS</small></div><div class="countdown-unit">--<small>SEGUNDOS</small></div></div></div>
</section>
<section class="page" id="informacoes"><img class="poster" src="imagens/informacoes.png" alt="Informações gerais do torneio">
<button class="hit" style="right:5%;top:1%;width:12%;height:6%" aria-label="Abrir menu" onclick="go('menu')"></button>
<a class="hit" style="left:17%;top:89%;width:67%;height:8%" aria-label="Como chegar à MUV Arena" href="https://www.google.com/maps/search/?api=1&query=MUV+Arena+Criciuma+SC" target="_blank" rel="noopener"></a></section>
<section class="page" id="inscricoes"><img class="poster" src="imagens/inscricoes.png" alt="Investimento e inscrições">
<button class="hit" style="right:5%;top:1%;width:12%;height:6%" aria-label="Abrir menu" onclick="go('menu')"></button>
<button class="hit" style="left:42%;top:67%;width:10%;height:6%" aria-label="Copiar chave Pix" onclick="copyPix()"></button>
<a class="hit" style="left:20%;top:77%;width:62%;height:8%" aria-label="Garantir inscrição pelo WhatsApp" href="https://wa.me/5548999221006?text=Ol%C3%A1%21%20Quero%20confirmar%20uma%20inscri%C3%A7%C3%A3o%20no%202%C2%BA%20Torneio%20V%C3%B4lei%20de%20Sexta%20%28atleta%20ou%20convidado%29." target="_blank" rel="noopener"></a></section>
<section class="page" id="regulamento"><img class="poster" src="imagens/regulamento.png" alt="Regulamento do torneio">
<button class="hit" style="right:5%;top:1%;width:12%;height:5%" aria-label="Abrir menu" onclick="go('menu')"></button>
<button class="hit" style="left:6%;top:77%;width:88%;height:10%" aria-label="Ler regras gerais do jogo" onclick="modal('regras')"></button></section>
<section class="page" id="premiacoes"><img class="poster" src="imagens/premiacoes.png" alt="Premiações: troféus, medalhas e destaques individuais">
<button class="hit award-menu" style="right:4%;top:1%;width:12%;height:6%" aria-label="Abrir menu" onclick="go('menu')"><span></span><span></span><span></span></button></section>
<section class="page" id="fotografia"><img class="poster" src="imagens/fotografia.png" alt="Fotografia oficial pela Foco Radical">
<button class="hit" style="right:4%;top:1%;width:12%;height:6%" aria-label="Abrir menu" onclick="go('menu')"></button>
<a class="hit" style="left:8%;top:74%;width:85%;height:9%" href="https://www.focoradical.com.br/" target="_blank" rel="noopener" aria-label="Conheça a Foco Radical"></a></section>
</main>
<div class="modal" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()"><div class="dialog"><button class="close" onclick="closeModal()" aria-label="Fechar">×</button><div id="modalContent"></div></div></div>
<div class="notice" id="notice">Chave Pix copiada!</div>
<script>
function go(id){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===id));window.scrollTo(0,0);history.replaceState(null,'','#'+id)}
const rules=`<h2 id="modalTitle">Regras gerais do jogo</h2>
<h3>Regras do jogo</h3><ul>
<li>A altura da rede será de 2,35 m.</li>
<li>Não existem posições determinadas na quadra (não é obrigatório rodízio), mas a ordem de saque deve ser mantida durante o jogo.</li>
<li>Não há linha de ataque. Os jogadores podem atacar ou bloquear de qualquer parte da área de jogo.</li>
<li>Não há linha central. Os jogadores podem entrar no espaço do adversário, quadra e/ou zona livre, desde que não interfiram no jogo do adversário.</li>
<li>Apenas um lançamento de saque é permitido. Não é permitida nenhuma outra tentativa de saque.</li>
<li>Será permitida a recepção através de toque, manchete ou espalmada (serão as regras de quadra).</li>
<li>Os adversários da equipe sacadora não devem impedir, com barreira, o adversário de ver o jogador no saque ou a trajetória da bola.</li>
<li>O contato do bloqueio não será considerado como um toque da equipe.</li>
<li>A bola não pode ser conduzida e/ou retida (geralmente isso ocorre pegando a bola de baixo para cima).</li>
<li>No primeiro toque da equipe, a bola pode tocar várias partes do corpo consecutivamente, desde que esses contatos ocorram em uma mesma ação.</li>
<li>É proibido tocar em qualquer parte da rede ou da antena, exceto o contato de cabelo ou vestuário.</li>
<li>Será permitido completar um ataque usando a “largada” de mão aberta direcionando a bola com os dedos. Também é permitido completar um ataque usando toque de bola, assim como na quadra.</li>
<li>Cada equipe tem direito a 1 tempo de 30 segundos durante o set.</li></ul>
<h3>Atribuições do capitão</h3><ul><li>Tirar par ou ímpar no início da partida para a escolha de quadra ou bola.</li><li>Pedir tempo (1 tempo de 30 segundos durante o set).</li></ul>`;
function modal(which){document.getElementById('modalContent').innerHTML=which==='regras'?rules:'<h2 id="modalTitle">Times e chaveamento</h2><p>Em breve mais informações.</p>';document.getElementById('overlay').classList.add('open')}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function copyPix(){const val='05726758951';if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(val).then(toast).catch(()=>fallback(val))}else fallback(val)}
function fallback(v){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast()}catch(e){alert('Chave Pix: '+v)}t.remove()}
function toast(){const n=document.getElementById('notice');n.style.display='block';setTimeout(()=>n.style.display='none',2200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const page=location.hash.slice(1);if(document.getElementById(page))go(page);

function updateCountdown(){
 const target=Date.parse('2026-11-14T13:00:00-03:00');
 const remaining=Math.max(0,target-Date.now());
 const el=document.getElementById('countdown-values');
 if(!el)return;
 if(remaining===0){el.innerHTML='<div class="countdown-finished" style="grid-column:1/-1">É HOJE! 🏐 O TORNEIO COMEÇOU!</div>';return;}
 const seconds=Math.floor(remaining/1000);
 const vals=[Math.floor(seconds/86400),Math.floor(seconds%86400/3600),Math.floor(seconds%3600/60),seconds%60];
 const labels=['DIAS','HORAS','MINUTOS','SEGUNDOS'];
 el.innerHTML=vals.map((v,i)=>`<div class="countdown-unit">${String(v).padStart(2,'0')}<small>${labels[i]}</small></div>`).join('');
}
updateCountdown();setInterval(updateCountdown,1000);
</script></body></html>
